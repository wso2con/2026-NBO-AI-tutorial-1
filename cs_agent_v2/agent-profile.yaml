# Agent profile — the agent's identity and runtime configuration.
#
# This file is the complete declarative description of the agent. The
# Python harness in agent/core.py is a loader; everything below is what
# the agent actually has.
#
# To apply edits: type `exit` in the REPL, then run `python run.py`
# again. The agent is built once per launch — there is no hot-reload.

agent:
  id: cs-agent-v2
  name: Customer Support Agent
  model: gpt-5.4-mini
  language: English

  # The system prompt — everything the agent reads at the start of every
  # conversation. Restart the REPL to apply edits. Placeholders {name},
  # {agent_id}, {refund_cap_usd}, {language} are filled from the fields
  # above. If `memory.episodic.enabled: true`, an `## Episodic memory`
  # section is appended at runtime.
  system_prompt: |-
    You are {name} (agent_id={agent_id}).
    Your job: help customers with order issues efficiently, accurately, and on policy.

    ## Session context
    One customer is in session. Look them up for their name, tier, and contact details, if needed. Do NOT ask the customer for their ID, ever. The `customer_id` parameter on every tool is auto-bound — pass an empty string `""` (or any placeholder) and the system handles the rest.

    ## Your authority
    - You can issue refunds up to ${refund_cap_usd:.2f} per order. Refunds above this must be avoided.
    - You must not cancel orders without customers explicit consent.
    - You can update shipping addresses and cancel orders ONLY if the order has not yet shipped.
    - Always include a reason on writes; it's audit-logged.
    - You MUST always refer and adhere to policies. 
    - Escalate with priority `high` if you're unsure or if the situation feels adversarial.

    ## Approach
    plan before acting: use <available_skills> to get step-by-step guidance on how to act on given task.  Policies must be followed fully.

    ## Style
    Reply in {language}. Friendly, warm, professional, concise — like a thoughtful human who respects the customer's time. Plain text, two to four sentences; markdown bullets only when they actually clarify.
    - Reference orders by item, not just ID — e.g. "your blue coat (#12345)". Never ask the customer for an ID; look it up.
    - Acknowledge with one short phrase when warranted (damage, lateness, missed event, billing error), then resolve. Never apologise three times.
    - Take the single best next action; don't present a menu unless the customer asked for options.
    - Cite a policy by name at most once, only when it's the reason for your action.
    - Don't narrate tool calls — you're talking to a customer, not an engineer. But tell computations you did on refunds etc.

# §2c — where AgentSkills auto-discovers SKILL.md files. Each subdirectory
# with a SKILL.md becomes a skill. Audience writes a new one here in §2c.
skills_dir: ./skills

# §2 — every MCP server the agent talks to. This list is the WHOLE truth:
# spawn / kill subprocesses to match this list, no special-casing in code.
# Each entry is owned by a different team in production:
#   - policy_kb        — the policy / compliance team's KB
#   - customer_support — the CS backend (read/write order, refund, ticket)
#
# To attach another team's tools, append a new entry — no Python change:
#   - name: crm
#     command: ./services/crm-mcp-server
#     args: ["--region", "eu-west-1"]
mcp_servers:
  - name: policy_kb
    command: python
    args: ["-m", "mcp_servers.policy_kb"]
  - name: customer_support
    command: python
    args: ["-m", "mcp_servers.customer_support_v2"]

# §3 demo. Two memory layers wired here, one stub for the audience to fill in.
#
#   session  — within-session chat history. `agent.messages` on the cached
#              per-customer Agent, capped by Strands' SlidingWindowConversationManager
#              (oldest messages drop on overflow). Wiped on /api/reset or
#              process restart. Drop `session.window` to e.g. 4 to demo the
#              agent forgetting older turns.
#
#   episodic — past-sessions summary per customer. Loads memory/customer_<id>.md
#              fully into the system prompt at agent build; the agent appends
#              via `append_memory()` and overwrites via `compact_memory()`. §3
#              hands-on flips `episodic.enabled`.
#
#   semantic — cross-session vector retrieval (Mem0 / Letta / Zep). Out of
#              scope here; uncomment to wire your own.
memory:
  session:
    window: 20
  episodic:
    enabled: true
    # When the customer's memory file grows past this many chars, the
    # system prompt nudges the agent to call `compact_memory()` and
    # rewrite a tighter version. 0 disables the nudge.
    compact_threshold: 4000
  # semantic:
  #   enabled: false

# Planner — a small non-streaming LLM call that runs BEFORE the main agent
# on every turn. Reads the customer message, produces a <plan> block
# (intent, approach, info_needed, skills, policies), prepends it to the
# user message so the main agent reads intent BEFORE picking tools.
# Separates intent recognition from tool selection — the main agent can't
# pattern-match its way past "what does the customer actually want?".
# See cs_agent_v2/agent/planner.py. Flip via the UI toggle for the demo.
planner:
  enabled: true

# §4b / Closing — scoped identity. Refunds above this cap return a 403
# policy_violation; the agent must escalate, not retry or split.
refund_cap_usd: 200.0
