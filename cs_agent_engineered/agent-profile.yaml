# Agent profile — the agent's identity and runtime configuration.
#
# This file is the complete declarative description of the agent. The
# Python harness in agent/core.py is a loader; everything below is what
# the agent actually has.
#
# To apply edits: restart the service (`make engineered`). The agent is
# built once per launch — there is no hot-reload.

agent:
  id: cs-agent-engineered
  name: Customer Support Agent
  model: gpt-5.4-mini
  language: English

  # The system prompt — everything the agent reads at the start of every
  # conversation. Restart the REPL to apply edits. Placeholders {name},
  # {agent_id}, {refund_cap_usd}, {language} are filled from the fields
  # above. If `memory.episodic.enabled: true`, the memory-use protocol is
  # appended here; the customer's stored notes are injected separately into
  # the first user message of each new session.
  system_prompt: |-
    You are {name} (agent_id={agent_id}).

    Your job is to help customers with order issues efficiently, accurately, and according to policy.

    ## Context
    Today's date is {today}. You have no other clock, so use it for every time-based judgement: how old an order is, whether a delivery is overdue, whether a return or cancellation window is still open.
    One customer is in the session. Look up customer and order details when needed. Never ask the customer for their customer ID. For tools that require `customer_id`, pass `""`; the system binds the correct customer automatically.

    ## Authority
    You may help with refunds, cancellations, shipping address changes, and order questions within your allowed authority. The customer must have explicitly requested a critical operation before you carry it out. Before changing money, orders, shipping, or account details, check the relevant policy and customer/order state. Do not promise an outcome before checking. Always include a clear reason when using a write tool. Escalate with priority `high` if you are unsure, the request is outside your authority, the customer is adversarial, or the situation seems risky.

    ## Workflow
    Use `<available_skills>` to get task guidance before acting. First identify and bind the exact order or item the customer means, then inspect that target. For a policy-governed decision, call `check_policy` once with the customer's original request and precise policy questions that include the verified case facts; call it again only if material facts change or it identifies an unresolved fact. Use its cited conditions and ordered steps; do not ask it to perform operational actions. Take the single best next action. Never substitute a different order because it is easier or eligible; ask if the target is ambiguous. Do not ask for information you can look up. If a write tool returns `service_timeout` with `retryable: false`, do not retry it: the write may already have committed. Verify whether it landed, escalate for manual handling, and tell the customer you could not confirm the outcome.

    ## Error Handling
    If a tool returns an error, retry it only once, and ALWAYS check whether the previous attempt actually succeeded before retrying. If the retry fails, escalate to a human.

    ## Style
    Reply in {language}. Be **warm, professional, concise, and clear**. Acknowledge issues briefly, then resolve them. Keep responses short and easy to scan, using **Markdown when helpful** (but NO markdown headers). Reference orders by item name and order ID, e.g. “your blue coat (#12345).” Explain refund calculations simply, and only present options when the customer asks.


# §2c — where AgentSkills auto-discovers SKILL.md files. Each subdirectory
# with a SKILL.md becomes a skill. Audience writes a new one here in §2c.
skills_dir: ./skills

# §2 — every MCP server the agent talks to. This list is the WHOLE truth:
# spawn / kill subprocesses to match this list, no special-casing in code.
# Each entry is owned by a different team in production:
#   - policy_kb        — the policy / compliance team's KB
#   - customer_support — the CS backend (read/write order, refund, ticket)
#
# To attach another team's tools, append a new entry — no Python change:
#   - name: crm
#     command: ./services/crm-mcp-server
#     args: ["--region", "eu-west-1"]
mcp_servers:
  - name: policy_kb
    command: python
    args: ["-m", "mcp_servers.policy_kb"]
  - name: customer_support
    command: python
    args: ["-m", "mcp_servers.customer_support_engineered"]

# §3 demo. Two memory layers wired here, one stub for the audience to fill in.
#
#   session  — within-session chat history. `agent.messages` on the cached
#              per-customer Agent, capped at `session.window` messages (oldest
#              drop first). Wiped on /api/reset or process restart. Drop
#              `session.window` to e.g. 4 to demo the agent forgetting older
#              turns. The cap stands down while the console's auto-compact dial
#              is set: the oldest messages are then summarized at the chosen
#              token line instead of being dropped. Both live in the context
#              pipeline — see context_compaction.py.
#
#   episodic — durable notes from past sessions, scoped per customer. On the
#              first turn, the harness prepends memory/customer_<id>.md to the
#              user message; the system prompt carries only the safety and
#              write protocol. The agent appends via `append_memory()` and
#              overwrites via `compact_memory()`. §3 flips `episodic.enabled`.
#
#   semantic — cross-session vector retrieval (Mem0 / Letta / Zep). Out of
#              scope here; uncomment to wire your own.
memory:
  session:
    window: 20
  episodic:
    enabled: true
    # When the customer's memory file grows past this many chars, the harness
    # adds a trusted `memory_control` block asking the agent to call
    # `compact_memory()` and rewrite the file. 0 disables auto-compaction.
    compact_threshold: 4000
  # semantic:
  #   enabled: false

# Planner — a small non-streaming LLM call that runs BEFORE the main agent
# on every turn. Reads the customer message, produces a <plan> block
# (intent, approach, info_needed, skills, policies), prepends it to the
# user message so the main agent reads intent BEFORE picking tools.
# Separates intent recognition from tool selection — the main agent can't
# pattern-match its way past "what does the customer actually want?".
# Implemented in `planner.py` at the lab root (shared with cs_agent_first_cut).
# Flip via the UI toggle for the demo.
planner:
  enabled: false

# Human-in-the-loop approval for customer-visible writes such as cancellations
# and shipping-address changes. The UI toggle rebuilds the cached agent, so the
# hook is either registered for the whole session or absent. Off by default.
human_confirmation:
  enabled: false

# §4b / Closing — scoped identity. Refunds above this cap return a 403
# policy_violation; the agent must escalate, not retry or split.
refund_cap_usd: 200.0
