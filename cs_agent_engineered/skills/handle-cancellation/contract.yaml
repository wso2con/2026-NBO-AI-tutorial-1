goal: Cancel an eligible order and resolve the customer's payment according to current policy.
required_criteria:
  - procedure_loaded
  - order_observed
  - policy_observed
  - refund_history_observed
  - order_cancelled
  - refund_committed
  - response_produced
ordering:
  - before: check_policy
    after: issue_refund
    violation: refund_was_attempted_before_policy_evidence
  - before: get_refund_history
    after: issue_refund
    violation: refund_was_attempted_before_refund_history
  - before: cancel_order
    after: issue_refund
    violation: refund_was_attempted_before_cancellation
